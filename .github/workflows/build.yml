name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          shellcheck luci-app-modemhealth/root/usr/bin/modemhealth \
            luci-app-modemhealth/root/etc/init.d/modemhealth \
            luci-app-modemhealth/root/etc/uci-defaults/* \
            scripts/*.sh

      - name: Check Python syntax
        run: python3 -m py_compile tests/*.py tools/*.py

      - name: Check JavaScript syntax
        run: |
          for f in $(find luci-app-modemhealth/htdocs -name '*.js'); do
            node -e "new Function(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Test the health rules
        run: node tests/health.test.js

      - name: Test the backend against the fake modem (OpenWrt 23.05 container)
        run: python3 tests/backend.test.py

      - name: Build ipk
        run: scripts/build-ipk.sh dist

      - name: Install the ipk on a clean OpenWrt 23.05
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" openwrt/rootfs:x86-64-23.05.6 sh -c '
            set -e
            mkdir -p /var/lock
            opkg update >/dev/null
            opkg install /dist/*.ipk
            ls -l /etc/config/modemhealth | grep -q "^-rw------- "
            modemhealth check || true
            grep -q ",failed,no_password," /etc/modemhealth/readings/*.csv
            test -x /etc/init.d/modemhealth
            ls /etc/rc.d/ | grep -q modemhealth'

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-modemhealth
          path: dist/*.ipk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
