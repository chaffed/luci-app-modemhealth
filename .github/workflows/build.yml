name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          shellcheck luci-app-modemhealth/root/usr/bin/modemhealth \
            luci-app-modemhealth/root/usr/libexec/rpcd/luci.modemhealth \
            luci-app-modemhealth/root/etc/init.d/modemhealth \
            luci-app-modemhealth/root/etc/uci-defaults/* \
            scripts/*.sh tests/*.sh

      - name: Check Python syntax
        run: python3 -m py_compile tests/*.py tools/*.py

      - name: Test the capture tool (what it removes before saving)
        run: python3 tests/capture.test.py

      - name: Test the T-Mobile gateway capture tool (safe requests, nothing identifying kept)
        run: python3 tests/capture_tmobile.test.py

      - name: Check JavaScript syntax
        run: |
          for f in $(find luci-app-modemhealth/htdocs luci-app-modemhealth/root/usr/share/modemhealth -name '*.js'); do
            node -e "new Function('module', require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Test the health rules
        run: node tests/health.test.js

      - name: Test the page logic
        run: node tests/ui.test.js

      - name: Test the report for the ISP
        run: node tests/report.test.js

      - name: Check that every setting is in both forms and the panel's module
        run: node tests/settings.test.js

      - name: Test the GL.iNet admin panel module
        run: |
          sudo apt-get install -y -qq lua5.1 lua-cjson >/dev/null
          luac5.1 -p luci-app-modemhealth/root/usr/lib/oui-httpd/rpc/modemhealth luci-app-modemhealth/root/usr/share/gl-validator.d/modemhealth.lua tests/gl/rpc.lua
          lua5.1 tests/gl_rpc.test.lua

      - name: Check JSON files
        run: |
          for f in luci-app-modemhealth/root/usr/share/*/*/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: Test the backend against the fake modem (OpenWrt 23.05 container)
        run: python3 tests/backend.test.py

      - name: Test the backend against fake T-Mobile gateways (OpenWrt 23.05 container)
        run: python3 tests/backend_gateway.test.py

      - name: Test the web interface in LuCI with a browser (OpenWrt 23.05 container)
        run: |
          npm install --no-save playwright-core
          node tests/luci.test.js

      - name: Test the GL.iNet admin panel pages with a browser (stand-in panel, real module)
        run: node tests/gl.test.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            .test-out/luci/*.png
            .test-out/gl/*.png
          if-no-files-found: ignore

      - name: Build ipk
        run: scripts/build-ipk.sh dist

      - name: Install, upgrade and remove the ipk on a clean OpenWrt 23.05
        run: sh tests/install.test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-modemhealth
          path: dist/*.ipk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
